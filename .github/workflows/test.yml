name: Run Unit Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  unit_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      test_path: 'test/unittests'
      system_deps: 'libssl-dev libfann-dev portaudio19-dev libpulse-dev'
