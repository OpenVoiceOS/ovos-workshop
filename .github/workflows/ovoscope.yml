name: Run Ovoscope End-to-End Tests
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  ovoscope_e2e:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y python3-dev swig libssl-dev libfann-dev
          python -m pip install --upgrade pip build wheel
      - name: Install the INTENT-4 producer under test (this branch)
        # ovos-workshop IS the producer; install the checked-out branch so the
        # e2e test runs against the code in this PR, not a published release.
        run: pip install -e .
      - name: Install the real e2e stack
        # Mirror the working pin-set from OpenVoiceOS/ovos-test-harness@dev
        # requirements.txt (the spec-stack combo selector). ovos-workshop is
        # pinned via `-e .` above, so it is intentionally omitted here.
        run: |
          pip install \
            "git+https://github.com/OpenVoiceOS/ovos-core@dev" \
            "git+https://github.com/OpenVoiceOS/ovos-adapt-pipeline-plugin@dev" \
            "git+https://github.com/OpenVoiceOS/ovos-padatious-pipeline-plugin@dev" \
            "git+https://github.com/OpenVoiceOS/ovoscope@dev" \
            "git+https://github.com/OpenVoiceOS/padacioso@dev" \
            "ovos-bus-client>=2.4.0a1" \
            "ovos-spec-tools>=0.16.1a2" \
            pytest pytest-cov
      - name: Run ovoscope end-to-end tests
        run: pytest -v test/end2end
