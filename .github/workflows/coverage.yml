name: Run CodeCov
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHON: '3.9'
    steps:
    - uses: actions/checkout@v6
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt install python3-dev
        python -m pip install build wheel
    - name: Install repo and test dependencies
      run: |
        sudo apt install libssl-dev libfann-dev portaudio19-dev libpulse-dev
        # the pyproject test extra is the one test dependency list
        pip install -e .[test]
        # test/end2end/session/ and its four local test skills were removed
        # long ago; the current end2end tree (intent4/keyword-casing) uses
        # in-place injected skills that need no install.
    - name: Generate coverage report
      run: |
        pytest --cov=./ovos_workshop --cov-report xml test/unittests
        pytest --cov-append --cov=ovos_workshop --cov-report xml test/end2end
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage/reports/
        fail_ci_if_error: true
        files: ./coverage.xml,!./cache
        flags: unittests
        name: codecov-umbrella
        verbose: true