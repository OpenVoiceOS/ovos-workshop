name: Run Ovoscope E2E Tests
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  ovoscope_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      test_path: 'test/ovoscope'
      install_extras: 'test'
