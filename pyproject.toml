[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-workshop"
dynamic = ["version"]
description = "frameworks, templates and patches for the OpenVoiceOS universe"
readme = "README.md"
license = "apache-2.0"
authors = [{name = "jarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"
dependencies = [
    "ovos-utils>= 0.13.3a2,<1.0.0",  # FakeBus folds before handlers (ovos-utils#396) — keeps in-place add_context mutations alive so intent-layer gating works
    "ovos_bus_client>=2.6.2a2,<3.0.0",  # HandlerLifecycle done-signal util (#246) + singleton-registry SessionManager (2.6.2a2)
    "ovos-gui-api-client>=0.1.0,<1.0.0",  # EnclosureAPI moved here; bus-client copy is a deprecation shim removed in bus-client 3.0.0
    "ovos-config>=0.0.12,<3.0.0",
    "ovos-spec-tools>=1.6.0a2",  # prerelease floor pin: resolves without --pre  # canonical_intent_topic — the OVOS-MSG-1 §2.1.1 dispatch-topic shape; also the canonical SessionManager registry and the OVOS-INTENT-4 intent-definition primitives
    "ovos-yes-no-plugin>=0.3.0,<1.0.0",
    "ovos-option-matcher-fuzzy-plugin>=0.0.1,<1.0.0",
    "ovos-number-parser>=0.0.1,<1.0.0",
    "ovos-plugin-manager>=2.4.0a1,<3.0.0",
    "rapidfuzz",
    "langcodes",
    "padacioso>=2.2.1a1,<3.0.0",  # OVOS-INTENT-1 §3.7: add_intent delegates expansion to ovos_spec_tools.expand, which raises MalformedTemplate on a dangling <name> reference instead of silently training the literal token
]

[project.optional-dependencies]
test = [
    "ovos-core>=2.5.3a1",  # mirrors set_context into OVOS-CONTEXT-1 intent_context so IntentLayers gating matches (test_intent_layers_e2e)
    "ovoscope>=0.1.0",
    "ovos-adapt-parser>=1.4.2a1",
    "pytest",
    "pytest-cov",
    "ovos-translate-server-plugin",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/OVOS-workshop"
Repository = "https://github.com/OpenVoiceOS/OVOS-workshop"

[project.scripts]
ovos-skill-launcher = "ovos_workshop.skill_launcher:_launch_script"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_workshop*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_workshop.version.__version__"}
